()=>{const c=pk([()=>{const a=ri(1,9),b=ri(1,9);return[`${a} kg ${b} hg = ... gram`,a*1000+b*100,`1 kg = 1.000 g dan 1 hg = 100 g, jadi ${a*1000} + ${b*100}.`]},()=>{const h=ri(1,9)/2+ri(0,5);return[`${D(h)} hektoliter = ... liter`,h*100,'1 hektoliter = 100 liter.']},()=>{const h=ri(2,9)/2;return[`${D(h)} jam = ... menit`,h*60,'1 jam = 60 menit.']},()=>{const k=ri(2,30)/2;return[`${D(k)} km = ... meter`,k*1000,'1 km = 1.000 m.']}])(),x=c[1];return mc(`Hasil konversi ${c[0]} adalah ....`,D(x),[D(x*10),D(x/10),D(x*100),D(x/100)],c[2])},

()=>{const s=ri(-10,10),d=ri(5,15),u=ri(3,12),v=s-d+u;return mc(`Suhu di puncak gunung pagi hari ${s}°C. Siang hari suhu turun ${d}°C, lalu sore naik ${u}°C. Suhu pada sore hari adalah ... °C.`,v,[s-d-u,s+d-u,s+d+u,v+1],`${s} − ${d} + ${u} = ${v}.`)},

const I6=()=>{const mm=ri(8,30)*10,w=pk(['pertama','kedua','ketiga','keempat']),dg=sv(300,170,`<circle cx='265' cy='28' r='18' fill='#ffb703'/><g fill='#cfe8ff' stroke='#0b5cad' stroke-width='2'><ellipse cx='140' cy='40' rx='40' ry='20'/><ellipse cx='110' cy='48' rx='28' ry='15'/><ellipse cx='172' cy='48' rx='28' ry='15'/></g><g stroke='#2a8bf2' stroke-width='3'><line x1='125' y1='75' x2='118' y2='95'/><line x1='145' y1='75' x2='138' y2='95'/><line x1='165' y1='75' x2='158' y2='95'/></g><rect x='0' y='130' width='110' height='40' fill='#4aa3ff'/><polygon points='110,170 110,125 170,95 300,120 300,170' fill='#7bc67b'/><path d='M200 128 Q150 140 115 150' stroke='#2a8bf2' stroke-width='5' fill='none'/><path d='M55 125 L55 75' stroke='#e63946' stroke-width='3'/><g fill='#fff' stroke='#0b5cad' stroke-width='2'><circle cx='55' cy='100' r='11'/><circle cx='140' cy='38' r='11'/><circle cx='140' cy='105' r='11'/><circle cx='165' cy='138' r='11'/></g><g font-size='13' text-anchor='middle' font-weight='700' fill='#1b2430'><text x='55' y='105'>1</text><text x='140' y='43'>2</text><text x='140' y='110'>3</text><text x='165' y='143'>4</text></g>`),p=`${dg}Air di bumi tidak pernah habis karena selalu berputar dalam daur air. Pertama, panas matahari membuat air laut, sungai, dan danau menguap menjadi uap air (1). Uap air naik ke langit, lalu mendingin dan berubah menjadi titik-titik air yang membentuk awan (2). Apabila awan sudah terlalu berat, titik air jatuh ke bumi sebagai hujan (3). Sebagian air hujan meresap ke dalam tanah, dan sisanya mengalir melalui sungai kembali ke laut (4).<br><br>Di Kota Segara, curah hujan bulan lalu mencapai ${mm} milimeter. Petugas cuaca mencatat bahwa hujan turun paling deras pada minggu ${w}. Selain itu, warga diminta tidak membuang sampah ke sungai. Oleh karena itu, aliran air ke laut tetap lancar dan banjir dapat dicegah. Anak-anak di sekolah juga ikut menampung air hujan untuk menyiram tanaman. Kegiatan sederhana itu membuat air tidak terbuang percuma dan kebun sekolah tetap hijau. Dengan memahami daur air, kita belajar menjaga air tetap bersih dan tidak boros menggunakannya.`;return [Q('M',TE,mc('Air laut menguap karena ....','panas matahari',['angin malam','bulan purnama','suara petir'],'Kalimat kedua menyebut panas matahari.')),Q('M',TE,mc('Curah hujan di Kota Segara bulan lalu adalah ....',`${mm} milimeter`,[`${mm+10} milimeter`,`${mm-10} milimeter`,`${mm*2} milimeter`],`Tertulis ${mm} milimeter.`)),Q('M',TE,mc('Hujan paling deras turun pada minggu ....',w,['pertama','kedua','ketiga','keempat'].filter(x=>x!=w),`Tertulis minggu ${w}.`)),Q('M',TE,bs('Tentukan Benar atau Salah sesuai teks!',[tf('Uap air berubah menjadi titik air yang membentuk awan.','Uap air berubah menjadi batu yang membentuk awan.'),tf('Sebagian air hujan meresap ke dalam tanah.','Seluruh air hujan hilang ke angkasa.'),tf(`Curah hujan bulan lalu ${mm} milimeter.`,`Curah hujan bulan lalu ${mm+20} milimeter.`)],'Cocokkan dengan kalimat dalam teks.')),Q('S',IN,mc('Tahap yang ditunjukkan nomor 3 pada gambar adalah ....','hujan',['penguapan','pengembunan','aliran sungai'],'Nomor 3 berada di bawah awan dan menunjukkan air jatuh.')),Q('S',IN,mc('Jika tahap nomor 1 tidak terjadi, yang paling mungkin terjadi adalah ....','awan tidak terbentuk dan hujan tidak turun',['hujan semakin deras','sungai semakin banyak','awan semakin tebal'],'Tanpa penguapan tidak ada uap air untuk membentuk awan.')),Q('S',IN,mc('Kata “Oleh karena itu” pada paragraf kedua menyatakan ....','akibat',['pertentangan','penambahan','waktu'],'Aliran air lancar adalah akibat sampah tidak dibuang ke sungai.')),Q('H',EV,mc('Judul yang paling tepat untuk teks tersebut adalah ....','Daur Air dan Cara Menjaganya',['Cara Membuat Awan','Banjir di Kota Segara','Sejarah Laut'],'Judul mencakup daur air dan ajakan menjaga air.')),Q('H',EV,mc('Pernyataan yang tidak sesuai dengan teks adalah ....','seluruh air hujan langsung kembali menjadi uap',['sebagian air hujan meresap ke dalam tanah','matahari membuat air menguap','awan terbentuk dari titik-titik air'],'Teks menyebut air hujan meresap dan mengalir ke laut.')),Q('H',EV,mc('Saran yang tepat bagi warga berdasarkan teks adalah ....','tidak membuang sampah ke sungai agar aliran air lancar',['membuang sampah ke sungai agar bersih','menimbun air hujan di jalan','menutup aliran sungai'],'Saran harus sejalan dengan isi teks.'))].map(x=>x&&({...x,p}))};
function genI2(seed){rnd=mul(seed);const out=[],seen=new Set(),sg=q=>q.q+'|'+(q.o?(q.o[q.k]||q.o.join()):q.s.join());sh([I1,I2,I3,I4,I5,I6]).slice(0,5).forEach(f=>out.push(...f().filter(Boolean)));[['an',2,'M'],['sn',2,'M'],['kd',2,'M'],['pg',1,'S'],['pa',1,'S'],['bk',2,'S']].forEach(([f,c,l])=>{let g=0,n=0;while(g<c&&n++<100){const x=wq[f]();if(x&&!seen.has(sg(x))){seen.add(sg(x));out.push(Q(l,'Kosakata',x));g++}}});return out}

function audit(){let bad=[],tot=0;const chk=(q,w)=>{tot++;const tx=JSON.stringify(q);if(/NaN|undefined|Infinity/.test(tx)||!q.lv||!q.kk)bad.push(w+': data rusak');if(q.t=='PG'&&(q.o.length!=4||new Set(q.o).size!=4||q.k<0||q.k>3))bad.push(w+': opsi/kunci PG');if(q.t=='PGK'&&(!q.k.length||q.o.length<4))bad.push(w+': kunci PGK');if(q.t=='BS'&&(q.k.length!=3||q.k.some(v=>typeof v!='boolean')))bad.push(w+': kunci BS')},run=(m,s,l)=>{const a=gen(m,s,l),w=`${m}/${l||'campuran'}/${s}`;if(a.length!=60)bad.push(w+': jumlah '+a.length);if(JSON.stringify(a)!=JSON.stringify(gen(m,s,l)))bad.push(w+': tidak konsisten');a.forEach(q=>chk(q,w))};for(let s=1;s<=1000;s++){run('mtk',s);run('ind',s)}for(const l of ['M','S','H'])for(let s=1;s<=100;s++)run('mtk',s,l);return `${tot.toLocaleString('id-ID')} soal diperiksa (Matematika dan Bahasa Indonesia campuran 1.000 paket, serta Matematika mudah/sedang/HOTS 100 paket): ${bad.length?bad.length+' masalah, contoh: '+bad.slice(0,3).join('; '):'tidak ada masalah struktur'}.`}
function auditOld(){let bad=[],tot=0;for(let s=1;s<=2000;s++){const mm=s>1000?'ind':'mtk',sd=(s-1)%1000+1,a=gen(mm,sd),b=JSON.stringify(gen(mm,sd));if(JSON.stringify(a)!=b)bad.push(`paket ${s}: tidak konsisten`);if(a.length!=60)bad.push(`paket ${s}: hanya ${a.length} soal`);a.forEach((q,i)=>{tot++;const tx=JSON.stringify(q);if(/NaN|undefined|Infinity/.test(tx))bad.push(`paket ${s} no ${i+1}: teks rusak`);if(q.t=='PG'&&(q.o.length!=4||new Set(q.o).size!=4||q.k<0||q.k>3))bad.push(`paket ${s} no ${i+1}: opsi/kunci PG`);if(q.t=='PGK'&&(!q.k.length||q.o.length<4||q.k.length>=q.o.length+1))bad.push(`paket ${s} no ${i+1}: kunci PGK`);if(q.t=='BS'&&(q.k.length!=3||q.k.some(v=>typeof v!='boolean')))bad.push(`paket ${s} no ${i+1}: kunci BS`)})}return `${tot.toLocaleString('id-ID')} soal diperiksa (Matematika dan Bahasa Indonesia, 1.000 paket per mapel): ${bad.length?bad.length+' masalah, contoh: '+bad.slice(0,3).join('; '):'tidak ada masalah struktur'}.`}
const $=id=>document.getElementById(id),H=s=>String(s).replace(/(\d+)\/(\d+)/g,'<span class="fr"><i>$1</i><i>$2</i></span>'),L=i=>String.fromCharCode(65+i);

function mulai(){const n=$('nm').value.trim();if(!n){$('au').textContent='Isi nama terlebih dahulu.';return}const m=$('mp').value,p=Math.floor(Math.random()*1000)+1,q=gen(m,p,m=='mtk'?$('lv').value:'mix');S={n,k:$('kl').value,m,p,q,a:q.map(x=>x.t=='PG'?null:x.t=='PGK'?[]:x.k.map(()=>null)),r:q.map(()=>0),i:0,end:Date.now()+3600000,c:0,done:0};clearInterval(tmr);tmr=setInterval(tick,1000);ex()}

else if(q.t=='PGK')b=q.o.map((o,j)=>`<div class="op ${a.includes(j)?'on':''}" onclick="sK(${j})"><b>${a.includes(j)?'✓':L(j)}</b><span>${H(o)}</span></div>`).join('');
